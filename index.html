<!doctype html>
<html lang="en" style="color-scheme: dark;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kulraj’s Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;family=Newsreader:opsz,wght@6..72,400;6..72,600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2FF;--panel:#FFFFFF;--ink:#16173A;--mute:#5B5E86;--line:#D9DBF5;--hi:#FFD84D;--on:#FFFFFF;
  --c1:#3D5AFE;--c2:#D9276F;--c3:#0B8A6C;
  --head:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;--serif:"Newsreader",Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1030;--panel:#1A1B45;--ink:#EEF0FF;--mute:#A3A7D6;--line:#2E3070;--hi:#4A4EC9;--on:#0F1030;--c1:#8FA3FF;--c2:#FF7FAF;--c3:#45DDB6;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0F1030;--panel:#1A1B45;--ink:#EEF0FF;--mute:#A3A7D6;--line:#2E3070;--hi:#4A4EC9;--on:#0F1030;--c1:#8FA3FF;--c2:#FF7FAF;--c3:#45DDB6;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1.15rem;line-height:1.7}
.wrap{max-width:74rem;margin:0 auto;padding:0 1.25rem}
.layout{display:grid;gap:2rem 3.5rem;grid-template-columns:minmax(0,1fr)}
#about{order:2;margin-top:3rem}
.about .av{width:6rem;height:6rem;border-radius:50%;background:var(--c1);color:var(--on);display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:2.6rem}
.about img.av{display:block;object-fit:cover}
.about input[type=file]{display:block;width:100%;margin-bottom:.75rem;font:inherit;font-size:.9rem;color:var(--ink)}
.about h2{margin:1rem 0 .6rem;font-size:1.6rem}
.about p{margin:0 0 .9rem;font-size:1.05rem;line-height:1.6}
.about textarea{display:block;width:100%;min-height:13rem;font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:.6rem .75rem;margin-bottom:.6rem}
.about .go{margin-right:.75rem}
@media (min-width:60rem){.layout{grid-template-columns:17rem minmax(0,1fr)}#about{order:0;position:sticky;top:1.5rem;align-self:start}}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--c1);outline-offset:3px;border-radius:6px}
#bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:5px;background:var(--c2);transform-origin:left;transform:scaleX(0);z-index:5}
nav{display:flex;flex-wrap:wrap;gap:.25rem 1.4rem;align-items:baseline;padding:1.25rem 0;font-family:var(--head);font-weight:500;font-size:1rem}
nav button{background:none;border:0;padding:.3rem 0;color:var(--mute);border-bottom:3px solid transparent}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--hi)}
nav .brand{font-weight:800;font-size:1.3rem;color:var(--ink);margin-right:auto;border:0}
nav .theme{border:2px solid var(--line);border-radius:99px;padding:.25rem .9rem;font-size:.85rem}
.title{font-family:var(--head);font-weight:800;font-size:clamp(2.9rem,11vw,5.8rem);line-height:.98;letter-spacing:-.035em;margin:3rem 0 1.1rem}
.sub{color:var(--mute);margin:0 0 2.5rem;max-width:30rem}
.tile{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;width:100%;text-align:left;background:var(--c);color:var(--on);border:0;border-radius:22px;padding:2.2rem 1.6rem;margin-bottom:.9rem;transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.tile:hover{transform:translateX(.6rem) rotate(-.7deg)}
.tile:active{transform:scale(.98)}
.tile b{font-family:var(--head);font-weight:800;font-size:clamp(1.9rem,6vw,2.7rem);line-height:1.05;letter-spacing:-.02em;display:block}
.tile span{display:block;margin-top:.3rem;opacity:.9;font-size:1.05rem;line-height:1.4}
.tile i{font-style:normal;font-family:var(--head);font-weight:800;font-size:1rem;border:2px solid currentColor;border-radius:99px;padding:.15rem .8rem;white-space:nowrap}
h2{font-family:var(--head);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;margin:3.5rem 0 1rem}
.tools{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:.75rem}
.tools input{flex:1 1 14rem;font:inherit;font-size:1rem;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:.6rem 1.1rem}
.tools input:focus{border-color:var(--c1);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chips button{font-family:var(--head);font-weight:500;font-size:.9rem;border:2px solid var(--c);background:none;color:var(--ink);border-radius:99px;padding:.3rem .95rem}
.chips button[aria-pressed="true"]{background:var(--c);color:var(--t)}
.row{display:grid;grid-template-columns:1fr;gap:1rem;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:1.15rem 0}
.row.pic{grid-template-columns:5rem 1fr}
.thumb{width:5rem;aspect-ratio:4/5;object-fit:cover;border-radius:10px;display:block;transition:transform .25s}
.row:hover .thumb{transform:rotate(-3deg) scale(1.05)}
.rt{font-family:var(--head);font-weight:800;font-size:1.4rem;line-height:1.25;display:block;letter-spacing:-.01em}
.hl{background:linear-gradient(var(--hi),var(--hi)) 0 92%/0% .4em no-repeat;transition:background-size .3s}
.row:hover .hl{background-size:100% .4em}
.meta{display:flex;gap:.9rem;font-family:var(--head);font-size:.9rem;color:var(--mute)}
.meta .tag{color:var(--c);font-weight:800}
.ex{display:block;color:var(--mute);margin-top:.3rem;font-size:1.05rem;line-height:1.5}
.band{background:var(--c);color:var(--on);border-radius:26px;padding:2rem 1.6rem;margin:1rem 0 2rem}
.band h1{font-family:var(--head);font-weight:800;font-size:clamp(2.6rem,10vw,4.5rem);line-height:1;letter-spacing:-.03em;margin:0 0 .5rem}
.band p{margin:0;opacity:.92}
.post-t{font-family:var(--head);font-weight:800;font-size:clamp(1.9rem,6.5vw,3rem);line-height:1.1;letter-spacing:-.025em;margin:.5rem 0 1.5rem}
.back{background:none;border:0;padding:0;margin-top:1.25rem;font-family:var(--head);font-weight:500;color:var(--mute);text-decoration:underline}
.car{max-width:30rem;margin:0 0 2rem}
.stage{position:relative;touch-action:pan-y}
.stage img{width:100%;height:auto;display:block;border-radius:16px;border:3px solid var(--c);background:var(--panel);cursor:zoom-in}
.cbtn{position:absolute;top:50%;transform:translateY(-50%);width:2.8rem;height:2.8rem;border-radius:50%;border:0;background:var(--c);color:var(--on);font-size:1.6rem;line-height:1;transition:transform .2s}
.cbtn:hover{transform:translateY(-50%) scale(1.12)}
.cbtn.prev{left:-.6rem}.cbtn.next{right:-.6rem}
.thumbs{display:flex;gap:.5rem;margin-top:.8rem}
.thumbs button{width:3.4rem;aspect-ratio:4/5;padding:0;border:3px solid transparent;border-radius:8px;overflow:hidden;opacity:.6;transition:opacity .2s,transform .2s}
.thumbs button[aria-current="true"]{border-color:var(--c);opacity:1;transform:translateY(-3px)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.count{font-family:var(--head);font-size:.9rem;color:var(--mute);margin:.5rem 0 0}
.text p{margin:0 0 1rem;white-space:pre-line}
.text.script{font-family:"Courier New",Courier,monospace;font-size:1rem}
.link{background:none;border:0;padding:0;font-family:var(--head);font-size:.9rem;color:var(--mute);text-decoration:underline}
.empty{color:var(--mute);margin-top:1.5rem}
.composer{margin-top:3.5rem;padding:1.25rem;background:var(--panel);border:2px dashed var(--c1);border-radius:16px;font-family:var(--head)}
.composer h3{margin:0 0 .75rem;font-size:1rem}
.composer select,.composer input,.composer textarea{display:block;width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:.6rem .75rem;margin-bottom:.6rem}
.composer textarea{min-height:9rem;font-family:var(--serif)}
.go{background:var(--c1);color:var(--on);border:0;border-radius:99px;padding:.7rem 1.4rem;font-family:var(--head);font-weight:800}
.go[disabled]{opacity:.5}
.note{font-family:var(--serif);font-size:.9rem;color:var(--mute);margin:.6rem 0 0}
#lb{position:fixed;inset:0;z-index:9;background:rgba(10,10,30,.94);display:flex;align-items:center;justify-content:center;padding:1rem;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
footer{padding:3.5rem 0 2rem;font-family:var(--head);font-size:.85rem;color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tile:hover,.row:hover .thumb{transform:none}}
</style>
</head>
<body>
<div id="bar" hidden=""></div>
<div class="wrap">
  <nav id="nav" aria-label="Sections"></nav>
  <div class="layout"><aside class="about" id="about" aria-label="About me"></aside><main id="app"></main></div>
  <footer>© <span id="yr">2026</span> Kulraj</footer>
</div>
<div id="lb" hidden=""><img alt="Full size slide"></div>

<script id="data" type="application/json">{"posts":[{"id":"appa1","section":"reviews","title":"I playtested Appa, and here’s why it should be on your radar","date":"2026-10-19","text":"A five-slide playtest review of Appa by Heat Death Studios.","images":["3fabda3c4e2a71436aeb297d812e5b52","1e1237226047bda801052f39b116c104","6b6c796c2e91148fb5a4d59598f33d3d","2338fa98bdaae7dcab1d37a52e71917e","08c7950e894e85ffe9cc4c2ad28910a0"]},{"id":"s2","section":"scripts","title":"Sample script: Chai at Midnight","date":"2026-10-19","text":"INT. TEA STALL - NIGHT\n\nA lone bulb hums. ASHA (20s) stirs a pot that is already done.\n\nASHA\nYou’re late.\n\nThe OLD MAN smiles and sits."},{"id":"s3","section":"writings","title":"Sample poem: Rooftop, Monsoon","date":"2026-10-19","text":"The sky clears its throat all afternoon.\nWe hang the laundry anyway.\n\nWhen the first drop lands on my wrist,\nit feels like being remembered."}],"about":"Hi, I’m Kulraj. I write reviews, scripts and short pieces, and I love video games.\n\nThis is where I keep my work. Take a look around."}</script>

<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const SECTIONS = [
  {id:"reviews",name:"Reviews",blurb:"Games, films and shows: what I played, watched and thought.",color:"var(--c1)"},
  {id:"scripts",name:"Scripts",blurb:"Short scenes and screenplays.",color:"var(--c2)"},
  {id:"writings",name:"Writings",blurb:"Stories, poems and essays.",color:"var(--c3)"}
];
let view = "home", owner = false, assetsApi = null, q = "", chip = "all", slide = 0, tx = null, editAbout = false;
const DEFAULT_ABOUT = "Hi, I’m Kulraj. I write reviews, scripts and short pieces, and I love video games.\n\nThis is where I keep my work. Take a look around.";
function renderAbout(){
  const t = DATA.about || DEFAULT_ABOUT;
  $("#about").innerHTML = editAbout
    ? `<h2>About me</h2><textarea id="about-text" aria-label="About me text">${esc(t)}</textarea>${assetsApi ? '<input type="file" id="about-img" accept="image/*" aria-label="Choose a photo">' : ""}${DATA.aboutPhoto ? '<p><button class="link" data-about-rm>Remove current photo</button></p>' : ""}<button class="go" data-about-save>Save</button><button class="link" data-about-cancel>Cancel</button>`
    : `${DATA.aboutPhoto ? `<img class="av" src="${img(DATA.aboutPhoto)}" alt="Photo of Kulraj">` : '<div class="av" aria-hidden="true">K</div>'}<h2>About me</h2>${t.split("\n\n").filter(Boolean).map(x => `<p>${esc(x)}</p>`).join("")}${owner ? '<button class="link" data-about-edit>Edit about me</button>' : ""}`;
}
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const sec = id => SECTIONS.find(s => s.id === id);
const sorted = () => [...DATA.posts].sort((a,b) => (b.date + b.id).localeCompare(a.date + a.id));
const IMGMAP = {"3fabda3c4e2a71436aeb297d812e5b52": "images/appa-1.png", "1e1237226047bda801052f39b116c104": "images/appa-2.png", "6b6c796c2e91148fb5a4d59598f33d3d": "images/appa-3.png", "2338fa98bdaae7dcab1d37a52e71917e": "images/appa-4.png", "08c7950e894e85ffe9cc4c2ad28910a0": "images/appa-5.png"};
const img = id => esc(IMGMAP[id] || "");
const cur = () => view.startsWith("post:") ? DATA.posts.find(p => p.id === view.slice(5)) : null;

function rowHTML(p){
  const s = sec(p.section), first = (p.images || [])[0];
  const ex = (p.text || "").split("\n\n")[0].slice(0,140);
  return `<button class="row ${first ? "pic" : ""}" style="--c:${s.color}" data-post="${esc(p.id)}">
    ${first ? `<img class="thumb" src="${img(first)}" alt="" loading="lazy">` : ""}
    <span><span class="rt"><span class="hl">${esc(p.title)}</span></span>
    <span class="meta"><span class="tag">${s.name}</span><span>${esc(p.date)}</span></span>
    ${ex ? `<span class="ex">${esc(ex)}</span>` : ""}</span></button>`;
}

function postHTML(p){
  const s = sec(p.section), imgs = p.images || [];
  const paras = (p.text || "").split("\n\n").filter(Boolean).map(x => `<p>${esc(x)}</p>`).join("");
  const car = imgs.length ? `<div class="car"><div class="stage"><img id="car-img" src="${img(imgs[0])}" alt="Slide 1 of ${imgs.length}: ${esc(p.title)}">
    ${imgs.length > 1 ? `<button class="cbtn prev" data-car="-1" aria-label="Previous slide">‹</button><button class="cbtn next" data-car="1" aria-label="Next slide">›</button>` : ""}</div>
    ${imgs.length > 1 ? `<div class="thumbs">${imgs.map((id,i) => `<button data-slide="${i}" aria-label="Go to slide ${i+1}" aria-current="${i===0}"><img src="${img(id)}" alt=""></button>`).join("")}</div>` : ""}
    <p class="count" id="car-count" aria-live="polite">Slide 1 of ${imgs.length}. Tap the slide to zoom.</p></div>` : "";
  return `<div style="--c:${s.color}"><button class="back" data-go="${p.section}">Back to ${s.name}</button>
    <h1 class="post-t">${esc(p.title)}</h1>
    <div class="meta" style="margin:-.75rem 0 1.5rem"><span class="tag">${s.name}</span><span>${esc(p.date)}</span></div>
    ${car}<div class="text ${p.section === "scripts" ? "script" : ""}">${paras}</div>
    ${owner ? `<button class="link" data-del="${esc(p.id)}">Delete this post</button>` : ""}</div>`;
}

function showSlide(i){
  const p = cur(); if(!p || !p.images || !p.images.length) return;
  const n = p.images.length; slide = (i + n) % n;
  const im = $("#car-img"); im.src = img(p.images[slide]); im.alt = `Slide ${slide+1} of ${n}: ${p.title}`;
  $("#car-count").textContent = `Slide ${slide+1} of ${n}. Tap the slide to zoom.`;
  document.querySelectorAll("[data-slide]").forEach(b => b.setAttribute("aria-current", +b.dataset.slide === slide));
}

function renderList(){
  const list = $("#list"); if(!list) return;
  const key = sec(view) ? view : chip, term = q.trim().toLowerCase();
  const ps = sorted().filter(p => (key === "all" || p.section === key) && (!term || (p.title + " " + (p.text||"")).toLowerCase().includes(term)));
  list.innerHTML = ps.map(rowHTML).join("") || `<p class="empty">${term ? "No posts match “" + esc(q) + "”." : "Nothing here yet. Check back soon."}</p>`;
  const ch = $("#chips");
  if(ch) ch.innerHTML = [["all","All"],...SECTIONS.map(s => [s.id,s.name])].map(([id,n]) =>
    `<button data-chip="${id}" aria-pressed="${id===chip}" style="--c:${id==="all" ? "var(--ink)" : sec(id).color};--t:${id==="all" ? "var(--bg)" : "var(--on)"}">${n}</button>`).join("");
}

function composerHTML(){
  if(!owner) return "";
  const d = sec(view) ? view : "reviews";
  return `<div class="composer"><h3>Add a post (only you can see this box)</h3>
    <select id="f-sec" aria-label="Section">${SECTIONS.map(s => `<option value="${s.id}" ${s.id===d?"selected":""}>${s.name}</option>`).join("")}</select>
    <input id="f-title" placeholder="Title" aria-label="Title">
    <textarea id="f-text" placeholder="Write or paste your post here" aria-label="Post text"></textarea>
    ${assetsApi ? '<input type="file" id="f-img" accept="image/*" multiple aria-label="Add images">' : ""}
    <button class="go" data-add>Publish post</button>
    <p class="note">Visitors see your post after the page reloads, which happens by itself.</p></div>`;
}

function controls(chips){
  return `<div class="tools"><label for="q" hidden>Search posts</label><input id="q" type="search" placeholder="Search posts" value="${esc(q)}">${chips ? '<div class="chips" id="chips"></div>' : ""}</div><div id="list" aria-live="polite"></div>`;
}

function render(){
  const post = cur(), navKey = post ? post.section : view;
  $("#nav").innerHTML = `<button class="brand" data-go="home">Kulraj</button>` + SECTIONS.map(s => `<button data-go="${s.id}" ${s.id===navKey?'aria-current="page"':""}>${s.name}</button>`).join("")
    + `<button class="theme" data-theme-toggle>Switch theme</button>`;
  $("#bar").hidden = !post; setBar();
  let h;
  if(post){ slide = 0; h = postHTML(post); }
  else if(view === "home"){
    h = `<h1 class="title">Kulraj’s Portfolio</h1><p class="sub">Reviews, scripts and writings, all in one place.</p>
      ${SECTIONS.map(s => `<button class="tile" style="--c:${s.color}" data-go="${s.id}"><b>${s.name}</b></button>`).join("")}`;
  } else {
    const s = sec(view);
    h = `<div class="band" style="--c:${s.color}"><h1>${s.name}</h1></div>${controls(false)}`;
  }
  $("#app").innerHTML = h + composerHTML(); renderList(); renderAbout();
}

function setBar(){
  const b = $("#bar"); if(b.hidden) return;
  const m = document.documentElement.scrollHeight - innerHeight;
  b.style.transform = `scaleX(${m > 0 ? Math.min(1, scrollY / m) : 1})`;
}

async function save(){
  const art = await claude.use("artifact");
  if(!art) throw new Error("Saving isn’t available here.");
  const c = document.documentElement.cloneNode(true);
  c.removeAttribute("data-theme");
  c.querySelector("#app").innerHTML = ""; c.querySelector("#nav").innerHTML = ""; c.querySelector("#about").innerHTML = "";
  const bar = c.querySelector("#bar"); bar.removeAttribute("style"); bar.hidden = true;
  const lb = c.querySelector("#lb"); lb.hidden = true; lb.querySelector("img").removeAttribute("src");
  c.querySelector("#data").textContent = JSON.stringify(DATA).replace(/</g,"\\u003c");
  await art.publish("<!doctype html>\n" + c.outerHTML);
}

document.addEventListener("click", async e => {
  if(e.target.id === "car-img"){ const l = $("#lb"); l.querySelector("img").src = e.target.src; l.hidden = false; return; }
  if(e.target.closest("#lb")){ $("#lb").hidden = true; return; }
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.go){ view = d.go; q = ""; render(); scrollTo(0,0); }
  else if(d.post){ view = "post:" + d.post; render(); scrollTo(0,0); }
  else if(d.chip){ chip = d.chip; renderList(); }
  else if(d.car){ showSlide(slide + +d.car); }
  else if(d.slide){ showSlide(+d.slide); }
  else if("themeToggle" in d){
    const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  }
  else if("aboutEdit" in d){ editAbout = true; renderAbout(); }
  else if("aboutCancel" in d){ editAbout = false; renderAbout(); }
  else if("aboutRm" in d){ const t = $("#about-text").value; DATA.aboutPhoto = null; DATA.about = t; renderAbout(); }
  else if("aboutSave" in d){
    const prev = [DATA.about, DATA.aboutPhoto];
    DATA.about = $("#about-text").value.trim(); b.disabled = true; b.textContent = "Saving…";
    try{
      const f = $("#about-img") && $("#about-img").files[0];
      if(f){ const r = await assetsApi.upload(f); DATA.aboutPhoto = r.id; }
      await save();
    }catch(err){ [DATA.about, DATA.aboutPhoto] = prev; b.disabled = false; b.textContent = "Save"; alert((err && err.message) || "Couldn’t save."); }
  }
  else if(d.del){
    if(!confirm("Delete this post?")) return;
    DATA.posts = DATA.posts.filter(p => p.id !== d.del);
    try{ await save(); }catch(err){ alert((err && err.message) || "Couldn’t save."); }
  } else if("add" in d){
    const title = $("#f-title").value.trim(), text = $("#f-text").value.trim(), section = $("#f-sec").value;
    const files = $("#f-img") ? [...$("#f-img").files] : [];
    if(!title || (!text && !files.length)){ alert("Add a title and some text or images first."); return; }
    b.disabled = true; b.textContent = "Publishing…";
    let post;
    try{
      const images = [];
      for(const f of files){ const r = await assetsApi.upload(f); images.push(r.id); }
      post = {id:Date.now().toString(36),section,title,text,images,date:new Date().toISOString().slice(0,10)};
      DATA.posts.push(post);
      await save();
    }catch(err){
      b.disabled = false; b.textContent = "Publish post";
      DATA.posts = DATA.posts.filter(x => x !== post);
      alert((err && err.message) || "Couldn’t save.");
    }
  }
});
document.addEventListener("input", e => { if(e.target.id === "q"){ q = e.target.value; renderList(); } });
document.addEventListener("keydown", e => {
  if(e.key === "Escape") $("#lb").hidden = true;
  if(!$("#lb").hidden || !cur() || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(e.key === "ArrowRight") showSlide(slide + 1);
  if(e.key === "ArrowLeft") showSlide(slide - 1);
});
document.addEventListener("touchstart", e => { tx = e.target.closest(".stage") ? e.touches[0].clientX : null; }, {passive:true});
document.addEventListener("touchend", e => {
  if(tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(dx) > 45) showSlide(slide + (dx < 0 ? 1 : -1));
}, {passive:true});
addEventListener("scroll", setBar, {passive:true});

$("#yr").textContent = new Date().getFullYear();
render();
(async () => {
  try{
    const user = await claude.use("user");
    if(user && user.isOwner()){ owner = true; try{ assetsApi = await claude.use("assets"); }catch(e){} render(); }
  }catch(e){}
})();
</script>
